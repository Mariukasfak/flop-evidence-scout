name: FLOP Scout Autonomous Agent & Live Dashboard

on:
  schedule:
    # Run every 15 minutes to maintain 24/7 presence and handle inquiries
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let two scheduled ticks post at the same time from the same identity.
concurrency:
  group: flop-scout-cycle
  cancel-in-progress: false

jobs:
  scout-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify agent logic before it is allowed to post
        run: npm test

      - name: Run FLOP Scout Autonomous Cycle & Generate Dashboard
        env:
          SCOUT_IDENTITY_JSON: ${{ secrets.SCOUT_IDENTITY_JSON }}
          SCRIBE_IDENTITY_JSON: ${{ secrets.SCRIBE_IDENTITY_JSON }}
          # Optional: a free-tier inference API key (Groq / Google AI Studio,
          # OpenAI chat shape). When set, cloud bursts do real inference and the
          # operator's PC does not need to be on at all. Unset, the run falls
          # back to the simulated backend exactly as before.
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_API_URL: ${{ secrets.INFERENCE_API_URL }}
          INFERENCE_API_MODEL: ${{ secrets.INFERENCE_API_MODEL }}
          TECHNOCORE_URL: https://technocore.chat
          # Names this runner in the cross-machine lease, so a process on the
          # operator's PC and a cloud run can never both write as the same
          # identity. The daemon also infers "github" from CI=true; this is
          # explicit rather than inferred.
          LEASE_HOLDER: github
          # Off by default, one setting away from on.
          #
          # Until 2026-08-30 this step ran `--dry-run`, and dryRun implies
          # readOnly, so every scheduled run wrote nothing at all: no lease, no
          # post, no recorded cycle. The failover the launcher window and
          # PROJEKTAS.md both promised had never once happened, and a 21-hour
          # outage went uncovered because there was nothing there to cover it.
          #
          # `--once` is the fix: one real cycle, lease respected, then exit. It
          # is left switched OFF because turning it on means this repository
          # starts posting in public on a schedule, and that is the operator's
          # decision to make, not a side effect of a bug fix.
          #
          # To turn on:  Settings -> Secrets and variables -> Actions ->
          #              Variables -> New variable -> CLOUD_WRITES = true
          CLOUD_WRITES: ${{ vars.CLOUD_WRITES }}
        run: |
          if [ "$CLOUD_WRITES" = "true" ]; then
            echo "Cloud writes ON — one real cycle, lease permitting."
            node src/daemon.mjs --once --url=https://technocore.chat
          else
            echo "Cloud writes OFF — rehearsal only, nothing is written."
            echo "Set the CLOUD_WRITES repository variable to true to enable failover."
            node src/daemon.mjs --dry-run --url=https://technocore.chat
          fi
          node tools/build-index.mjs

      - name: Raise a GitHub issue if the faucet radar fired
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/faucet-alert.mjs

      - name: Commit and Push Live Status Update
        run: |
          git config --global user.name "FLOP-Scout-Bot"
          git config --global user.email "bot@technocore.chat"
          node scripts/publish-docs.mjs "chore(status): update live dashboard and audit state [skip ci]"
