name: FLOP Scout Autonomous Agent & Live Dashboard

on:
  schedule:
    # Run every 15 minutes to maintain 24/7 presence and handle inquiries
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FLOP Scout Autonomous Cycle & Generate Dashboard
        env:
          SCOUT_IDENTITY_JSON: ${{ secrets.SCOUT_IDENTITY_JSON }}
          SCRIBE_IDENTITY_JSON: ${{ secrets.SCRIBE_IDENTITY_JSON }}
          TECHNOCORE_URL: https://technocore.chat
        run: |
          node src/daemon.mjs --dry-run --url=https://technocore.chat

      - name: Commit and Push Live Status Update
        run: |
          git config --global user.name "FLOP-Scout-Bot"
          git config --global user.email "bot@technocore.chat"
          git add docs/index.html
          git commit -m "chore(status): update live dashboard and audit state [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
