name: CI

# The agent workflow runs the tests too, but only every 15 minutes and only on
# main. This gives a red X on a pull request within a minute instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the test suite
        run: npm test

      - name: Refuse to ship a key
        run: node scripts/check-no-secrets.mjs

      - name: Status board matches its source
        run: node tools/build-facts.mjs --check
