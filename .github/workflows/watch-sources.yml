name: Watch official sources

# Hourly is the right cadence for documentation and release changes: fast enough
# not to be last, slow enough that the tracker issue stays readable.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check every watched source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/watch-sources.mjs

      - name: Report anything that moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-change-alert.mjs

      - name: Re-measure the network and rebuild the guide
        # Keeps the published charts honest. A guide whose figures were typed in
        # by hand is stale the day after it is written.
        run: |
          node tools/measure-network.mjs
          node tools/render-charts.mjs
          node tools/build-guide.mjs

      - name: Commit the new baseline
        run: |
          git config --global user.name "FLOP-Scout-Bot"
          git config --global user.email "bot@technocore.chat"
          git add docs
          git commit -m "chore(watch): source baseline, fresh measurements, rebuilt guide [skip ci]" || echo "Nothing moved."
          git pull --rebase origin main
          git push origin main
