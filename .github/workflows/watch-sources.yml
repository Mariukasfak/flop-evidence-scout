name: Watch official sources

# Hourly is the right cadence for documentation and release changes: fast enough
# not to be last, slow enough that the tracker issue stays readable.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check every watched source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/watch-sources.mjs --commit-baseline

      - name: Report anything that moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-change-alert.mjs

      - name: Re-measure the network and rebuild the guide
        # Keeps the published charts honest. A guide whose figures were typed in
        # by hand is stale the day after it is written.
        run: |
          node tools/measure-network.mjs
          node tools/render-charts.mjs
          node tools/build-guide.mjs
          node tools/build-index.mjs

      - name: Commit the new baseline
        run: |
          git config --global user.name "FLOP-Scout-Bot"
          git config --global user.email "bot@technocore.chat"
          node scripts/publish-docs.mjs "chore(watch): source baseline, fresh measurements, rebuilt guide [skip ci]"

      - name: Is the scheduled work actually running?
        # Runs LAST and is allowed to fail the job. A scheduler that quietly
        # stops is the failure this repository has hit twice, and a red run is
        # the only thing that makes it visible. The commit above has already
        # landed, so a red job here never costs data.
        #
        # The identity is required, not optional: the combined view lives in a
        # note keyed by the Scout's DID. Without it this step generated a fresh
        # random key, read that stranger's non-existent activity note, found
        # nothing, and reported the agent as stopped — while it was running fine
        # on the operator's machine.
        env:
          SCOUT_IDENTITY_JSON: ${{ secrets.SCOUT_IDENTITY_JSON }}
        run: node tools/check-freshness.mjs

      # Runs even when the check above failed, because a stoppage is exactly the
      # case where it fails — and an alarm that only fires on a green run is not
      # an alarm. The agent was once down for 21 hours while this workflow went
      # red four times: the monitoring worked, and a red build is something you
      # have to go and look at. This one arrives as an email.
      - name: Tell me if the agent has actually stopped
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCOUT_IDENTITY_JSON: ${{ secrets.SCOUT_IDENTITY_JSON }}
        run: node scripts/agent-down-alert.mjs
