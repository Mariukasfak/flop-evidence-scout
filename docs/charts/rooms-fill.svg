    .dot-last  { stroke: var(--chart-bg, #fff); stroke-width: 2.5; }
    .end-label { fill: var(--chart-line, #a25c00); font: 700 13px Archivo, system-ui, sans-serif; }
    .axis      { stroke: var(--chart-axis, #b9bfca); stroke-width: 1; }
  </style>
  
